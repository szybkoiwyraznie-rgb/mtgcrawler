# JEDNORAZOWA naprawa załączników PL9; usunąć po udanym uruchomieniu.
# Odpowiada ręcznemu workflow_dispatch release-y.yml z istniejącym tagiem,
# ale integracja sandboxa nie ma uprawnienia actions:write do dispatch.
name: SRW Y — jednorazowa naprawa Release PL9

on:
  push:
    branches: [arena/aa963b07-mtgcrawler]
    paths: ['.github/workflows/release-y-pl9-repair.yml']

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest UnityPy pycryptodome numpy tree_sitter tree_sitter_lua tree_sitter_powershell
      - working-directory: srw-y-translation
        run: python -m pytest -q tests/
      - name: Build and attach the verified PL9 kit
        working-directory: srw-y-translation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='patch-y-pl9-2026-11-11'
          ASSET='srw-y-translation-pl9-2026-11-11.zip'
          python tools/build_y_release.py --release translations/current_release.json \
            --output build/patcher/SRW_Y_PATCH_PL.zip
          python tools/build_y_release_meta.py --release translations/current_release.json \
            --patch build/patcher/SRW_Y_PATCH_PL.zip \
            --out-dir build/release_y --asset-name "$ASSET"
          python tools/build_y_release_notes.py \
            --info build/release_y/RELEASE_INFO.json \
            --coverage build/release_y/PL_COVERAGE.json \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            --changes '- Aktualny instalator PL9: 488 bundli i 85 610 rekordów; naprawiony wybór planu Releases oraz pełne pokrycie właściwych tekstów tabel.' \
            --out build/release_y/OPIS_WYDANIA.md
          gh release upload "$TAG" "build/release_y/$ASSET" \
            build/release_y/SHA256SUMS.txt build/release_y/PL_COVERAGE.json \
            build/release_y/RELEASE_INFO.json --clobber
          gh release edit "$TAG" --notes-file build/release_y/OPIS_WYDANIA.md
          gh release view "$TAG" --json tagName,url,assets \
            --jq '"\(.tagName) \(.url) assets=\([.assets[].name]|join(","))"'
