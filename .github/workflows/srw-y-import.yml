name: SRW Y — importer and reading regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'srw-y-translation/**'
      - '.github/workflows/srw-y-import.yml'
  push:
    branches: [main]
    paths:
      - 'srw-y-translation/**'
      - '.github/workflows/srw-y-import.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-intake:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies (all declared here, no private data)
        run: python -m pip install pytest UnityPy pycryptodome Pillow tree-sitter tree-sitter-powershell
      - name: Full synthetic suite (no Drive/private inputs, no skips)
        working-directory: srw-y-translation
        run: python -m pytest -q -rs
