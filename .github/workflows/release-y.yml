# SRW Y project workflow (srw-y-translation/) only.
# Every merge to `main` publishes a fresh PL patcher kit — same rule as SRW OE.
# Nothing private is involved: the kit is a source-only installer (no game binaries).
name: SRW Y — release the PL patcher

on:
  push:
    branches: [main]
    paths:
      - 'srw-y-translation/**'
      - '.github/workflows/release-y.yml'
  pull_request:
    branches: [main]
    paths:
      - 'srw-y-translation/**'
      - '.github/workflows/release-y.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the built kit to this existing release instead of creating a new one (e.g. patch-y-pl5-e220dfef). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install pytest UnityPy pycryptodome numpy tree_sitter tree_sitter_lua tree_sitter_powershell

      - name: Test tools (no private game files)
        working-directory: srw-y-translation
        run: python -m pytest -q tests/

      - name: Build the PL kit, its metadata and the release notes
        id: kit
        working-directory: srw-y-translation
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Nazwa wydania opisuje jego treść, nie numer przebiegu: etykieta planu
          # i data. Numer przebiegu jest dopisywany do opisu, gdy ten sam kit
          # zostanie zbudowany ponownie (patrz `publish_y_release.py`).
          LABEL="$(python -c "import json;print(json.load(open('translations/current_release.json'))['label'])")"
          TAG="patch-y-$(echo "$LABEL" | tr '[:upper:]' '[:lower:]')-$(date -u +%Y-%m-%d)"
          ASSET="srw-y-translation-$(echo "$LABEL" | tr '[:upper:]' '[:lower:]')-$(date -u +%Y-%m-%d).zip"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          # Jeden wskaźnik steruje ZIP-em, wersją, pokryciem i opisem.
          # Meta dodatkowo odrzuci ZIP, którego wbudowany plan nie jest aktualny.
          python tools/build_y_release.py \
            --release translations/current_release.json \
            --output "build/patcher/SRW_Y_PATCH_PL.zip"
          python tools/build_y_release_meta.py \
            --release translations/current_release.json \
            --patch build/patcher/SRW_Y_PATCH_PL.zip \
            --out-dir build/release_y --asset-name "$ASSET"
          python tools/build_y_release_notes.py \
            --info build/release_y/RELEASE_INFO.json \
            --coverage build/release_y/PL_COVERAGE.json \
            --tag "$TAG" --repo "$REPO" \
            --out build/release_y/OPIS_WYDANIA.md
          # Osłona drugiej warstwy: opis nie może mieć odnośników do Dysku ani
          # surowych identyfikatorów plików (generator ma już zaporę validate_notes,
          # to łapie też ręczne edycje opisu).
          if grep -iEn 'drive\.google\.com|google[ _-]?drive|google_drive|\bdysku?\b|\bdrive\b' build/release_y/OPIS_WYDANIA.md; then
            echo "::error::Opis wydania zawiera odniesienie do Dysku — przerywam przed publikacją."
            exit 1
          fi
          ls -l build/release_y

      - name: Keep the built kit as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: srw-y-pl-kit-${{ steps.kit.outputs.tag }}
          path: srw-y-translation/build/release_y/*
          if-no-files-found: error
          retention-days: 30

    outputs:
      tag: ${{ steps.kit.outputs.tag }}
      asset: ${{ steps.kit.outputs.asset }}

  publish:
    # PRs (including forks) only build and test. No public release before merge.
    # Ręczne uruchomienie z polem `tag` może uzupełnić załączniki istniejącego
    # wydania także z gałęzi roboczej (tylko maintainerzy mają `workflow_dispatch`).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.tag != '' || github.ref == 'refs/heads/main'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified kit (do not rebuild different bytes)
        uses: actions/download-artifact@v4
        with:
          name: srw-y-pl-kit-${{ needs.build.outputs.tag }}
          path: release

      - name: Publish the kit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ls -l release
          if [ -n "$TARGET_TAG" ]; then
            # Manual run: attach the fresh build to a release that already exists.
            gh release upload "$TARGET_TAG" \
              "release/$ASSET" release/SHA256SUMS.txt \
              release/PL_COVERAGE.json release/RELEASE_INFO.json --clobber
            gh release view "$TARGET_TAG" --json assets --jq '.assets[].name'
            exit 0
          fi
          # Decyduje SHA-256 instalatora, nie numer przebiegu CI. Ten sam ZIP nie
          # tworzy drugiego wydania — tak powstały `patch-y-pl9-2026-11-11`
          # i `patch-y-57-d8ec8812` z bajtowo identycznym kit-em.
          cd srw-y-translation
          python tools/publish_y_release.py \
            --repo "$GH_REPO" \
            --tag "$TAG" \
            --notes "$GITHUB_WORKSPACE/release/OPIS_WYDANIA.md" \
            --zip "$GITHUB_WORKSPACE/release/$ASSET" \
            --extra "$GITHUB_WORKSPACE/release/SHA256SUMS.txt" \
                    "$GITHUB_WORKSPACE/release/PL_COVERAGE.json" \
                    "$GITHUB_WORKSPACE/release/RELEASE_INFO.json" \
            --run "$GITHUB_RUN_NUMBER"
          gh release list --limit 3
