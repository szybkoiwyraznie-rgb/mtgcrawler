# SRW Y project workflow (srw-y-translation/) only.
# Builds the patcher kit from repository files and attaches it to a GitHub release.
# Nothing private is involved: the kit is a source-only installer (no game binaries).
name: SRW Y — build and attach the PL patcher

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the kit to (e.g. patch-y-pl5-e220dfef). Leave empty to only build.'
        required: false
        default: ''
  push:
    tags:
      - 'patch-y-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install pytest UnityPy pycryptodome numpy tree_sitter tree_sitter_lua tree_sitter_powershell

      - name: Test tools (no private game files)
        working-directory: srw-y-translation
        run: python -m pytest -q tests/

      - name: Build the PL kit and its release metadata
        id: kit
        working-directory: srw-y-translation
        run: |
          set -euo pipefail
          python tools/build_y_release.py --plan translations/pl2/PLAN_PL2.json \
            --report translations/pl2/AUDIT_PL2.json \
            --output build/patcher/SRW_Y_PATCH_PL5_NAZWY_DUCHOW.zip
          python tools/build_y_release_meta.py \
            --patch build/patcher/SRW_Y_PATCH_PL5_NAZWY_DUCHOW.zip \
            --out-dir build/release_y_pl5 --asset-name srw-y-translation-pl-v5.zip
          echo "sha=$(sha256sum build/release_y_pl5/srw-y-translation-pl-v5.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Keep the built kit as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: srw-y-pl-kit
          path: srw-y-translation/build/release_y_pl5/*
          if-no-files-found: error
          retention-days: 30

    outputs:
      sha: ${{ steps.kit.outputs.sha }}

  attach:
    # Only when a tag was given: attach the verified files to that release.
    needs: build
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built kit (do not rebuild different bytes)
        uses: actions/download-artifact@v4
        with:
          name: srw-y-pl-kit
          path: release

      - name: Attach the kit to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -l release
          gh release upload "$TAG" \
            release/srw-y-translation-pl-v5.zip \
            release/SHA256SUMS.txt \
            release/PL_COVERAGE.json \
            release/RELEASE_INFO.json \
            --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
