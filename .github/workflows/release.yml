# SRW OE project workflow (srw-oe-translation/) only.
# Future game titles get their own workflow files; do not generalise this one.
name: SRW OE — release translation patch (EN + PL)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install Pillow

      - name: Test tools (no private game files)
        working-directory: srw-oe-translation
        run: python -m unittest discover -s tests

      - name: Build and verify BOTH current language kits
        id: pair
        shell: bash
        working-directory: srw-oe-translation
        run: |
          set -euo pipefail
          VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          python tools/build_release_pair.py --version "$VERSION" --out local/ci-release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Preserve verified pair for PR review and publication
        uses: actions/upload-artifact@v4
        with:
          name: patchers-en-pl-${{ steps.pair.outputs.version }}
          path: srw-oe-translation/local/ci-release/*
          if-no-files-found: error
          retention-days: 30

    outputs:
      version: ${{ steps.pair.outputs.version }}

  publish:
    # PRs (including forks) only build/test. No public release before merge.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified pair (do not rebuild different assets)
        uses: actions/download-artifact@v4
        with:
          name: patchers-en-pl-${{ needs.build.outputs.version }}
          path: release

      - name: Publish EN and PL in one release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="patch-build-${VERSION}"
          EN="release/srw-oe-translation-v${VERSION}.zip"
          PL="release/srw-oe-translation-pl-v${VERSION}.zip"
          test -f "$EN" && test -f "$PL"
          (cd release && sha256sum --check SHA256SUMS.txt)
          cat > release-notes.md <<EOF
          Complete English and Polish one-click patchers for SRW OE (NPJH50521).
          Source commit: ${GITHUB_SHA}. Both ZIPs use the same tested tools revision.

          PL includes the complete PL5 return across all 35 story episodes (00–34),
          all simulator scenes, all battle quotes (cytaty.md), all nine views, and
          all reviewed UI, skill, mission, cache, and native v5 font fixes.
          See PL_COVERAGE.json and kit README. Automated checks do not replace full-game runtime QA.

          Unzip the chosen language kit, run PATCH.bat, select your own original
          Japanese 1.08 ISO and decrypted DLC. Preserve saves. No game binaries,
          ISO, DLC, saves, or native game-font bitmaps are included in these kits.
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "SRW OE — EN + PL (${VERSION})" --notes-file release-notes.md
          fi
          gh release upload "$TAG" "$EN" "$PL" release/SHA256SUMS.txt release/PL_COVERAGE.json release/RELEASE_PAIR.json --clobber
          # Do not let a slower older build replace a newer main build as Latest.
          MAIN_SHA="$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)"
          LATEST=false
          if [ "$MAIN_SHA" = "$GITHUB_SHA" ]; then LATEST=true; fi
          gh release edit "$TAG" --draft=false --latest="$LATEST" --notes-file release-notes.md
