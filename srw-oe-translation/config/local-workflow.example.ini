# Example settings for the local workflow. Keep your real copy private (it is git-ignored
# as config/local-workflow.ini). You normally do not need to edit it by hand:
# RUN_PIPELINE.bat asks for the folders once and writes that file itself.
#
# Forward slashes are accepted by Windows and avoid backslash escaping.
# Relative paths are resolved from the folder that contains this file.
# Keep the converter's companion library (CpkMaker.dll) beside YACpkTool.exe.

[local]
# Folder containing the mostly-.EDAT set and the base ISO. It is only read, never written.
input_root = C:/path/to/game-files

# Base folder for run output. Each run writes a new timestamped subfolder here, for example
# C:/SRW_OE_out/20261009-120000. The path must not contain spaces or non-ASCII letters
# (YACpkTool rejects them) and must not be inside input_root.
output_root = C:/SRW_OE_out

# Optional. Leave blank to use bounded auto-discovery: YACpkTool.exe in the tools folder or
# in the input folder, or in a folder named YACpkTool inside either of them.
tool_path = C:/path/to/YACpkTool/YACpkTool.exe

# Optional. A SHA-256 of YACpkTool.exe (64 lowercase hex digits, for example from
# certutil -hashfile). When set, a different converter is refused.
# expected_tool_sha256 = <64 lowercase hex digits>
