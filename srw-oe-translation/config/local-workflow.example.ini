# Copy this template to a private local file and edit the paths once.
# Forward slashes are accepted by Windows and avoid backslash escaping.
# Keep the converter distribution's companion DLLs beside YACpkTool.exe.

[local]
# Folder containing the mostly-.EDAT set and the base ISO.
input_root = C:/path/to/game-files

# A fresh, separate directory for extracted CPK contents and reports.
output_root = C:/path/to/srw-oe-work

# Optional. May be on the Desktop, alongside the game files, or elsewhere.
# Leave blank to use bounded auto-discovery (script directory/input root).
tool_path = C:/path/to/YACpkTool/YACpkTool.exe
